<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overmind</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      background: #0d0f1a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid #1e2235;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: rgba(139, 92, 246, 0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .title { font-weight: 700; font-size: 15px; }
    .subtitle { font-size: 11px; color: #64748b; }
    .body { padding: 14px 16px; }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #131625;
      border-radius: 8px;
      border: 1px solid #1e2235;
      margin-bottom: 10px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.idle { background: #475569; }
    .dot.running { background: #a78bfa; animation: pulse 1s infinite; }
    .dot.complete { background: #4ade80; }
    .dot.error { background: #f87171; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .status-text { flex: 1; color: #94a3b8; }
    .step-label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      margin-top: 12px;
    }
    .steps { display: flex; flex-direction: column; gap: 4px; }
    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #64748b;
    }
    .step.active { background: rgba(139, 92, 246, 0.1); color: #a78bfa; }
    .step.done { color: #4ade80; }
    .step-icon { font-size: 11px; width: 16px; text-align: center; }
    .footer {
      padding: 10px 16px 14px;
      border-top: 1px solid #1e2235;
    }
    .open-btn {
      display: block;
      width: 100%;
      padding: 8px;
      background: rgba(139, 92, 246, 0.15);
      color: #a78bfa;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s;
    }
    .open-btn:hover { background: rgba(139, 92, 246, 0.25); }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div>
      <div class="title">Overmind</div>
      <div class="subtitle">@djthirstyboy Pipeline</div>
    </div>
  </div>
  <div class="body">
    <div class="status-row">
      <div class="dot idle" id="statusDot"></div>
      <span class="status-text" id="statusText">Idle — waiting for job</span>
    </div>
    <div class="step-label">Pipeline Steps</div>
    <div class="steps" id="steps">
      <div class="step" data-step="lyrics"><span class="step-icon">○</span> Lyrics (ChatGPT)</div>
      <div class="step" data-step="art"><span class="step-icon">○</span> Cover Art (DALL-E)</div>
      <div class="step" data-step="audio"><span class="step-icon">○</span> Audio (Suno)</div>
      <div class="step" data-step="metadata"><span class="step-icon">○</span> Title & Description</div>
      <div class="step" data-step="complete"><span class="step-icon">○</span> Complete</div>
    </div>
  </div>
  <div class="footer">
    <a href="https://overmind-dashboard.vercel.app/youtube" target="_blank" class="open-btn">
      Open Overmind Dashboard
    </a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
